apiVersion: v1
kind: Service
metadata:
  name: redis-service # Your app will connect to this DNS name
  namespace: default # Or your specific namespace
  labels:
    app: redis
    tier: cache
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
    tier: cache
  type: ClusterIP # Only accessible within the cluster 