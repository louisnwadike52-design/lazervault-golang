root = "."
tmp_dir = "tmp"

[build]
  # Main build command
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  
  # Watch everything in all directories
  include_dir = ["./"]
  
  # Watch all relevant file extensions
  include_ext = ["go", "tpl", "tmpl", "html", "env", "yml", "yaml", "json"]
  
  # Exclude unnecessary directories
  exclude_dir = ["tmp", "vendor", ".git", "node_modules"]
  
  
  # Build arguments
  args_bin = ["--port", "8080"]
  
  # Full rebuild on main.go changes
  # full_bin = "go run main.go"
  
  # Error handling
  stop_on_error = true
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true