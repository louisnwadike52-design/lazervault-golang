version: '3.8'

services:
  # Facial Recognition Gateway (This Go service)
  facial-recognition-gateway:
    build:
      context: .
      dockerfile: Dockerfile.facial-recognition
    ports:
      - "8080:8080"  # REST Gateway
      - "9090:9090"  # gRPC Gateway
    environment:
      - AI_SERVICE_URL=http://facial-recognition-service:8000
      - JWT_SECRET=your-jwt-secret
      - LOG_LEVEL=info
      - REDIS_SERVER_ADDR=redis:6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=lazervault_go_db
      - DB_SSLMODE=disable
      - TOKEN_SYMMETRIC_KEY=n4MRwVnITxIHLNiTLiuNKwodarP5zWqw
      - ACCESS_TOKEN_DURATION=1h
      - REFRESH_TOKEN_DURATION=24h
      - HTTP_SERVER_PORT=8080
      - GRPC_SERVER_PORT=9090
    depends_on:
      - facial-recognition-service
      - redis
      - postgres
    networks:
      - facial-recognition-network

  # Django Facial Recognition Service (External)
  facial-recognition-service:
    image: facial-recognition-django:latest
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/facial_recognition_db
    volumes:
      - facial_models:/app/models
      - facial_uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - facial-recognition-network

  # Redis for caching and background jobs
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - facial-recognition-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lazervault_go_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - facial-recognition-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - facial-recognition-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - facial-recognition-network

volumes:
  facial_models:
  facial_uploads:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  facial-recognition-network:
    driver: bridge 