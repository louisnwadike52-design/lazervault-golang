syntax = "proto3";

package pb;
option go_package = "lazervaultGo/pb";

import "google/protobuf/timestamp.proto";

message User {
  uint64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone_number = 5;
  string role = 6;
  bool verified = 7;
  bool isEmailVerified = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string phone_number = 5;
  string role = 6;
}

message CreateUserResponse {
  User user = 1;
  string message = 2;
  bool success = 3;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
} 