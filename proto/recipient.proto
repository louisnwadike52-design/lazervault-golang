syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "lazervaultGo/pb";

// OpenAPI v2 documentation options
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "LazerVault Recipient Service";
    version: "1.0";
    contact: {
      name: "LazerVault Support";
      url: "https://github.com/LazerVault";
      email: "support@lazervault.example";
    };
  };
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Authentication token, prefixed by Bearer: Bearer <token>"
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearer"
    }
  }
};

// Represents a saved recipient for transfers
message Recipient {
  uint64 id = 1;
  string name = 2;                // Nickname (e.g., "Landlord")
  string account_number = 3;      // External bank account number (masked?)
  string sort_code = 4;           // Optional sort code
  string bank_name = 5;
  bool is_favorite = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Request to create a new recipient
message CreateRecipientRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["name"]
    }
  };
  string name = 1;
  string account_number = 2;
  string sort_code = 3;
  string bank_name = 4;
  bool is_favorite = 5;
  string type = 6;
  uint64 internal_account_id = 7 [json_name = "internal_account_id"];
}

// Response after creating a recipient
message CreateRecipientResponse {
  Recipient recipient = 1;
}

// Request to list recipients (no specific filters for now)
message ListRecipientsRequest {}

// Response containing a list of recipients
message ListRecipientsResponse {
  repeated Recipient recipients = 1;
}

// Request to update a recipient
message UpdateRecipientRequest {
   option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["recipient_id"]
      // Fields here are optional for update
    }
  };
  uint64 recipient_id = 1 [json_name = "recipient_id"];
  optional string name = 2;
  optional string account_number = 3;
  optional string sort_code = 4;
  optional string bank_name = 5;
  optional bool is_favorite = 6;
}

// Response after updating a recipient
message UpdateRecipientResponse {
  Recipient recipient = 1;
}

// Request to delete a recipient
message DeleteRecipientRequest {
  uint64 recipient_id = 1 [json_name = "recipient_id"];
}

// Response after deleting a recipient (can be empty)
message DeleteRecipientResponse {
  string message = 1; // e.g., "Recipient deleted successfully"
}

// Service definition for managing recipients
service RecipientService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "Manages saved external transfer recipients."
  };

  // Creates a new recipient for the authenticated user.
  rpc CreateRecipient (CreateRecipientRequest) returns (CreateRecipientResponse) {
    option (google.api.http) = { post: "/v1/recipients", body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Recipient", tags: ["Recipients"]
      security: { security_requirement: { key: "bearer" } }
    };
  }

  // Lists all recipients saved by the authenticated user.
  rpc ListRecipients (ListRecipientsRequest) returns (ListRecipientsResponse) {
    option (google.api.http) = { get: "/v1/recipients" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Recipients", tags: ["Recipients"]
      security: { security_requirement: { key: "bearer" } }
    };
  }

  // Updates an existing recipient.
  rpc UpdateRecipient (UpdateRecipientRequest) returns (UpdateRecipientResponse) {
    option (google.api.http) = {
      patch: "/v1/recipients/{recipient_id}", body: "*"
      additional_bindings { put: "/v1/recipients/{recipient_id}", body: "*" } // Allow PUT as well
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update Recipient", tags: ["Recipients"]
      security: { security_requirement: { key: "bearer" } }
    };
  }

  // Deletes a specific recipient.
  rpc DeleteRecipient (DeleteRecipientRequest) returns (DeleteRecipientResponse) {
    option (google.api.http) = { delete: "/v1/recipients/{recipient_id}" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete Recipient", tags: ["Recipients"]
      security: { security_requirement: { key: "bearer" } }
    };
  }
} 