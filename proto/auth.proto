syntax = "proto3";

package pb;
option go_package = "lazervaultGo/pb";

import "google/protobuf/timestamp.proto";
import "user.proto";

message Metadata {
  string AccessToken = 1;
  string ExpiresAt = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  Metadata metadata = 2;
  bool success = 3;
  string msg = 4;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
} 