  string phone = 5;
  string country_code = 6;
  bool email_verified = 7;
  bool phone_verified = 8;
  bool two_factor_enabled = 9;
  string two_factor_method = 10;
  string profile_picture = 11;
  string created_at = 12;
  string updated_at = 13;
  string signup_status = 14;         // Signup completion status
  string current_signup_step = 15;   // Current step in signup flow
  string username = 16;              // LazerTag username
  bool identity_verified = 17;       // BVN/NIN verified
  string identity_type = 18;         // "bvn" or "nin"
  string identity_verified_at = 19;  // ISO 8601 timestamp
  string date_of_birth = 20;         // YYYY-MM-DD format
  int32 kyc_tier = 21;               // KYC tier level (1, 2, 3)
  string kyc_status = 22;            // KYC verification status
  repeated string roles = 23;       // All roles (matches JWT "roles")
  string role = 24;                 // Primary role for UI (matches JWT "role")
  string auth_type = 25;            // EMAIL_PASSWORD | PHONE_PASSCODE — pins the user's login method
  string preferred_login_method = 26; // user-selectable: "email_password" | "phone_passcode" | ""
  bool has_password = 27;             // password_hash != ""
}

// ===== Signup Progress Tracking =====

// Signup status values
enum SignupStatus {
  SIGNUP_STATUS_UNSPECIFIED = 0;
  SIGNUP_STATUS_CREATED = 1;           // Account created, no verifications done
  SIGNUP_STATUS_EMAIL_VERIFIED = 2;    // Email has been verified
  SIGNUP_STATUS_PHONE_VERIFIED = 3;    // Phone has been verified
  SIGNUP_STATUS_IDENTITY_VERIFIED = 4; // BVN/NIN has been verified
  SIGNUP_STATUS_PASSCODE_SET = 5;      // Passcode has been registered
  SIGNUP_STATUS_COMPLETE = 6;          // All signup steps completed
}

// Step status values
enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_PENDING = 1;           // Step not started
  STEP_STATUS_IN_PROGRESS = 2;       // Step started but not completed
  STEP_STATUS_COMPLETED = 3;         // Step completed successfully
  STEP_STATUS_SKIPPED = 4;           // Step was skipped by user
}

// Individual signup step progress
message SignupStepProgress {
  string step_name = 1;              // e.g., "form_page_0", "email_verify", "passcode_setup"
  StepStatus status = 2;
  string step_data = 3;              // JSON string with step-specific data
  string completed_at = 4;           // ISO 8601 timestamp
  string created_at = 5;
  string updated_at = 6;
}

// Overall signup progress
message SignupProgress {
  string user_id = 1;
  SignupStatus status = 2;
  string current_step = 3;
  repeated SignupStepProgress steps = 4;
  string signup_completed_at = 5;    // ISO 8601 timestamp when signup was fully completed
  string created_at = 6;
  string updated_at = 7;
}

// Get signup progress request
message GetSignupProgressRequest {
  // User ID is extracted from the JWT token
}

// Get signup progress response
message GetSignupProgressResponse {
  bool success = 1;
  string msg = 2;
  SignupProgress progress = 3;
  string next_step = 4;              // Suggested next step to navigate to
  bool is_complete = 5;              // True if signup is fully complete
}

// Update signup step request
message UpdateSignupStepRequest {
  string step_name = 1;              // Step being updated
  StepStatus status = 2;             // New status for the step
  string step_data = 3;              // Optional JSON data for the step
}

// Update signup step response
message UpdateSignupStepResponse {
  bool success = 1;
  string msg = 2;
  SignupProgress progress = 3;       // Updated progress
  string next_step = 4;              // Suggested next step
}

// Complete signup request
message CompleteSignupRequest {
  // Marks the entire signup flow as complete
}

// Complete signup response
message CompleteSignupResponse {
  bool success = 1;
  string msg = 2;
  SignupProgress progress = 3;
}

// ===== Identity Verification =====

// Identity type enum
enum IdentityType {
  IDENTITY_TYPE_UNSPECIFIED = 0;
  IDENTITY_TYPE_BVN = 1;   // Bank Verification Number (Nigeria)
  IDENTITY_TYPE_NIN = 2;   // National Identification Number (Nigeria)
  IDENTITY_TYPE_GHANA_CARD = 3;          // Ghana Card
  IDENTITY_TYPE_KENYA_NATIONAL_ID = 4;   // Kenya National ID
  IDENTITY_TYPE_KRA_PIN = 5;             // Kenya Revenue Authority PIN
  IDENTITY_TYPE_SA_ID = 6;               // South African Smart ID Card
  IDENTITY_TYPE_SA_PASSPORT = 7;         // South African Passport
  IDENTITY_TYPE_UK_PASSPORT = 8;         // UK Passport
  IDENTITY_TYPE_UK_DRIVING_LICENSE = 9;  // UK Driving Licence
  IDENTITY_TYPE_US_SSN = 10;             // US Social Security Number
  IDENTITY_TYPE_US_STATE_ID = 11;        // US State-issued ID
  IDENTITY_TYPE_US_PASSPORT = 12;        // US Passport
  IDENTITY_TYPE_DRIVERS_LICENSE = 13;    // Generic Driver's License
  IDENTITY_TYPE_INTERNATIONAL_PASSPORT = 14; // International Passport
}

// Verify identity request
message VerifyIdentityRequest {
  IdentityType identity_type = 1;     // Type of identity document
  string identity_number = 2;         // ID number (BVN, NIN, SSN, Ghana Card, etc.)
  string date_of_birth = 3;           // YYYY-MM-DD format, required for verification
  string country_code = 4;            // ISO 3166-1 alpha-2 country code (NG, GH, KE, ZA, GB, US)
  string first_name = 5;              // Required for non-Nigerian verifications
  string last_name = 6;               // Required for non-Nigerian verifications
  string phone_number = 7;            // Phone number for verification
}

// Verified identity details returned from provider
message VerifiedIdentity {
  string first_name = 1;
  string last_name = 2;
  string middle_name = 3;
  string phone_number = 4;
  string date_of_birth = 5;
  string gender = 6;
  string photo_url = 7;               // Base64 encoded photo from BVN/NIN
  string address = 8;
  string state_of_origin = 9;
  string lga_of_origin = 10;
}

// Verify identity response
message VerifyIdentityResponse {
  bool success = 1;
  bool verified = 2;                  // True if identity was verified (sync only)
  string error_code = 3;              // Error code if verification failed
  string error_message = 4;           // Human-readable error message
  VerifiedIdentity identity = 5;      // Verified identity details (sync only)
  VirtualAccountInfo virtual_account = 6; // Created virtual account (on success)
  // Async verification fields (Onfido/Persona - UK/US)
  string verification_id = 7;         // Provider verification ID for status polling
  string status = 8;                  // "verified", "pending", "failed"
  string session_url = 9;             // SDK/WebView URL for async verification
  string session_token = 10;          // SDK token for native Onfido/Persona integration
  // BVN data reconciliation (populated when name/DOB mismatch detected)
  DataReconciliation reconciliation = 11;
}

// BVN data reconciliation result
message DataReconciliation {
  string name_action = 1;       // "none" (auto-accepted), "confirm" (user must choose), "reject" (mismatch too large)
  double name_match_score = 2;  // 0.0-1.0 similarity score
  string verified_name = 3;     // Name from BVN provider
  string profile_name = 4;      // Name from user profile
  bool dob_mismatch = 5;        // True if BVN DOB differs from profile DOB
  string verified_dob = 6;      // DOB from BVN provider
  string profile_dob = 7;       // DOB from user profile
  bool phone_mismatch = 8;      // True if BVN phone differs
}

// Confirm BVN name after reconciliation
message ConfirmBVNNameRequest {
  string action = 1;            // "use_bvn_name" or "keep_profile_name"
  string verification_id = 2;   // Verification session ID from VerifyIdentity
}

// Confirm BVN name response
message ConfirmBVNNameResponse {
  bool success = 1;
  string message = 2;
  KYCVerificationStatus status = 3;
  KYCTier current_tier = 4;
}

// Virtual account info (returned after identity verification)
message VirtualAccountInfo {
  string account_number = 1;
  string bank_name = 2;
  string bank_code = 3;
  string account_name = 4;
  string currency = 5;
  string provider = 6;
}

// Get identity verification status request
message GetIdentityVerificationStatusRequest {
  // User ID extracted from JWT
}

// Get identity verification status response
message GetIdentityVerificationStatusResponse {
  bool success = 1;
  string msg = 2;
  bool identity_verified = 3;
  IdentityType identity_type = 4;
  string identity_verified_at = 5;
  string masked_identity_number = 6;  // e.g., "****567890" for privacy
}

// ===== User Lookup for Transfers =====

// Lookup user by username request
message LookupUserByUsernameRequest {
  string username = 1;                // Username without @ prefix
}

// Lookup user by phone request
message LookupUserByPhoneRequest {
  string phone = 1;                   // Phone number in E.164 format
}

// User lookup response (common for both username and phone lookup)
message UserLookupResponse {
  bool success = 1;
  string msg = 2;
  bool found = 3;
  UserLookupResult user = 4;
}

// User lookup result - minimal info for transfers
message UserLookupResult {
  string user_id = 1;
  string username = 2;                // LazerTag username
  string first_name = 3;
  string last_name = 4;
  string profile_picture = 5;
  bool is_lazervault_user = 6;        // Always true for internal users
  string phone_number = 7;            // Phone number (masked for privacy)
  string email = 8;                   // Email (masked for privacy)
  string primary_account_id = 9;      // Primary account ID (UUID) for transfers
  string country_code = 10;           // User's country code (e.g., "NG", "US")
  // SearchUsers only: server-side exact match vs the request query (clients must not compare masked email/phone strings).
  bool email_matches_search_query = 11;
  bool phone_matches_search_query_exact = 12;
}

// Search users by multiple fields request
message UserSearchRequest {
  string query = 1;                   // Search text; unified mode matches substring on username (optional leading @), name, email, phone (digits)
  int32 limit = 2;                    // Maximum number of results (default 10, max 50)
  string search_type = 3;             // Optional: "username", "name", "phone", "email", or "" for unified search across all fields
  string country_code = 4;            // Optional: filter results to only users in this country/locale
  int32 offset = 5;                   // Optional: pagination offset (number of results to skip); pairs with limit for load-more
}

// Search users response
message UserSearchResponse {
  bool success = 1;
  string msg = 2;
  repeated UserLookupResult users = 3;
}

// ===== KYC Progressive Onboarding =====

// KYC Tier enum
enum KYCTier {
  KYC_TIER_UNKNOWN = 0;
  KYC_TIER_1 = 1;   // Basic - Phone/Email verified
  KYC_TIER_2 = 2;   // Standard - ID verified (BVN/NIN)
  KYC_TIER_3 = 3;   // Enhanced - Full KYC with address proof
}

// Document type enum for KYC
enum DocumentType {
  DOCUMENT_TYPE_UNKNOWN = 0;
  DOCUMENT_TYPE_BVN = 1;                    // Bank Verification Number (Nigeria)
  DOCUMENT_TYPE_NIN = 2;                    // National ID (Nigeria)
  DOCUMENT_TYPE_DRIVERS_LICENSE = 3;        // Driver's License
  DOCUMENT_TYPE_PASSPORT = 4;               // International Passport
  DOCUMENT_TYPE_VOTERS_CARD = 5;            // Voter's Card
  DOCUMENT_TYPE_PROOF_OF_ADDRESS = 6;       // Utility Bill, Bank Statement
  DOCUMENT_TYPE_SELFIE = 7;                 // Selfie photo for liveness
}

// Document status enum
enum DocumentStatus {
  DOCUMENT_STATUS_UNKNOWN = 0;
  DOCUMENT_STATUS_PENDING_UPLOAD = 1;
  DOCUMENT_STATUS_UPLOADED = 2;
  DOCUMENT_STATUS_UNDER_REVIEW = 3;
  DOCUMENT_STATUS_APPROVED = 4;
  DOCUMENT_STATUS_REJECTED = 5;
}

// Initiate KYC request
message InitiateKYCRequest {
  KYCTier target_tier = 1;                  // Target tier to upgrade to
  string country_code = 2;                  // ISO country code (optional, defaults to NG)
}

// Initiate KYC response
message InitiateKYCResponse {
  bool success = 1;
  string session_id = 2;                    // Unique session ID for this KYC flow
  repeated string required_documents = 3;    // List of required document types
  repeated string required_fields = 4;       // List of required form fields
  string redirect_url = 5;                   // Optional redirect URL for external verification
  string error_message = 6;                  // Error message if success = false
}

// Upload document request
message UploadDocumentRequest {
  DocumentType document_type = 1;           // Type of document being uploaded
  string document_front_url = 2;            // URL to front of ID document
  string document_back_url = 3;             // URL to back of ID document (if applicable)
  string selfie_url = 4;                    // URL to selfie photo
  string proof_of_address_url = 5;          // URL to proof of address document
}

// Upload document response
message UploadDocumentResponse {
  bool success = 1;
  string message = 2;
  string document_id = 3;                   // ID of uploaded document
  DocumentStatus status = 4;                // Status of the uploaded document
}

// Skip KYC upgrade request
message SkipKYCUpgradeRequest {
  bool skip_tier_2 = 1;                     // Skip Tier 2 and stay at Tier 1
  bool skip_tier_3 = 2;                     // Skip Tier 3 and stay at Tier 2
}

// Skip KYC upgrade response
message SkipKYCUpgradeResponse {
  bool success = 1;
  KYCTier assigned_tier = 2;                // The tier user is assigned to
  string message = 3;
  repeated string next_steps = 4;            // Recommended next steps
}

// Get user documents request
message GetUserDocumentsRequest {
  // User ID extracted from JWT
}

// Verification document info
message VerificationDocument {
  string id = 1;
  DocumentType document_type = 2;
  string document_url = 3;
  DocumentStatus status = 4;
  string uploaded_at = 5;                   // ISO 8601 timestamp
  string verified_at = 6;                   // ISO 8601 timestamp
  string rejection_reason = 7;
}

// Get user documents response
message GetUserDocumentsResponse {
  bool success = 1;
  repeated VerificationDocument documents = 2;
}

// ===== KYC Phase 2: Async Verification & Document Upload =====

// KYC status enum
enum KYCVerificationStatus {
  KYC_STATUS_UNKNOWN = 0;
  KYC_STATUS_NOT_STARTED = 1;
  KYC_STATUS_IN_PROGRESS = 2;
  KYC_STATUS_PENDING_REVIEW = 3;
  KYC_STATUS_APPROVED = 4;
  KYC_STATUS_REJECTED = 5;
  KYC_STATUS_EXPIRED = 6;
}

// KYC Tier info with limits and benefits
message KYCTierInfo {
  KYCTier tier = 1;
  KYCVerificationStatus status = 2;
  string display_name = 3;
  string description = 4;
  repeated string benefits = 5;
  int64 daily_transaction_limit = 6;
  int64 daily_receive_limit = 7;
  int64 max_balance = 8;
  string verified_at = 9;
  string expires_at = 10;
  bool is_current = 11;
  bool is_locked = 12;
}

// Get KYC status request
message GetKYCStatusRequest {
  // User ID extracted from JWT
}

// Get KYC status response
message GetKYCStatusResponse {
  bool success = 1;
  KYCVerificationStatus status = 2;
  KYCTier current_tier = 3;
  repeated KYCTierInfo tier_info = 4;
  string last_updated = 5;
  string rejection_reason = 6;
}

// Country KYC requirements
message CountryKYCRequirements {
  string country_code = 1;
  repeated IdentityType accepted_id_types = 2;
  repeated IdentityType mandatory_id_types = 3;
  bool address_proof_required = 4;
  bool liveness_check_required = 5;
  int64 tier_1_daily_limit = 6;
  int64 tier_2_daily_limit = 7;
  int64 tier_3_daily_limit = 8;
}

// Get country requirements request
message GetCountryRequirementsRequest {
  string country_code = 1;
}

// Get country requirements response
message GetCountryRequirementsResponse {
  bool success = 1;
  CountryKYCRequirements requirements = 2;
}

// Create verification session request (async provider flow)
message CreateVerificationSessionRequest {
  KYCTier target_tier = 1;
  string country_code = 2;
  IdentityType id_type = 3;
  string id_number = 4;
  string first_name = 5;
  string last_name = 6;
  string date_of_birth = 7;
  string phone_number = 8;
}

// Create verification session response
message CreateVerificationSessionResponse {
  bool success = 1;
  string verification_id = 2;
  string session_url = 3;
  string session_token = 4;
  string provider = 5;
  KYCVerificationStatus status = 6;
  string error_message = 7;
}

// Confirm verification request (after SDK/WebView completion)
message ConfirmVerificationRequest {
  string verification_id = 1;
  string provider = 2;
  string provider_auth_code = 3;
  map<string, string> metadata = 4;
}

// BVN / profile name reconciliation after Mono verify (optional)
message BVNNameReconciliation {
  string name_action = 1; // confirm | reject | none
  double name_match_score = 2;
  string verified_name = 3;
  string profile_name = 4;
}

// Confirm verification response
message ConfirmVerificationResponse {
  bool success = 1;
  KYCVerificationStatus status = 2;
  KYCTier current_tier = 3;
  string message = 4;
  BVNNameReconciliation bvn_name_reconciliation = 5;
}

// Get presigned document upload URL request (Tier 3)
message GetDocumentUploadURLRequest {
  string document_type = 1;   // gov_id_front, gov_id_back, selfie, proof_of_address
  string content_type = 2;    // image/jpeg, image/png, application/pdf
}

// Get presigned document upload URL response
message GetDocumentUploadURLResponse {
  bool success = 1;
  string upload_url = 2;
  string storage_key = 3;
  int64 expires_at = 4;
}

// Document submission item for batch review
message DocumentSubmissionItem {
  string storage_key = 1;
  string document_type = 2;
  string content_type = 3;
}

// Submit documents for review request (Tier 3)
message SubmitDocumentsForReviewRequest {
  repeated DocumentSubmissionItem documents = 1;
}

// Submit documents for review response
message SubmitDocumentsForReviewResponse {
  bool success = 1;
  string message = 2;
  KYCVerificationStatus status = 3;
}

// ============================================
// Channel Authentication Messages (SMS/WhatsApp/Phone Banking)
// ============================================

// Channel login request - authenticate via phone number
message ChannelLoginRequest {
  string phone_number = 1;                   // E.164 format phone number
  string channel_type = 2;                   // "telephony" (SMS/Phone) or "whatsapp"
}

// Channel login response - returns access token for channel operations
message ChannelLoginResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;                   // JWT access token for channel operations
  string refresh_token = 4;                  // Refresh token
  string user_id = 5;                        // User ID
  string account_id = 6;                     // Primary account ID
  string currency = 7;                       // Default currency (NGN)
  string user_country = 8;                   // User country code (NG)
  int32 expires_in = 9;                     // Token expiry in seconds
}

// Channel register request - register new user via phone channel
message ChannelRegisterRequest {
  string phone_number = 1;                   // E.164 format phone number
  string first_name = 2;                     // User's first name
  string last_name = 3;                      // User's last name
  string email = 4;                          // User's email address (for OTP)
  string channel_type = 5;                   // "telephony" or "whatsapp"
  string country_code = 6;                   // ISO country code (default: NG)
}

// Channel register response - sends OTP to email
message ChannelRegisterResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;                        // Newly created user ID
  bool otp_sent = 4;                         // Whether OTP was sent successfully
  string masked_email = 5;                   // Masked email for display
  int32 otp_expires_in_seconds = 6;          // OTP expiry time
}

// Channel verify registration request - verify OTP for new account
message ChannelVerifyRegistrationRequest {
  string phone_number = 1;                   // E.164 format phone number
  string otp_code = 2;                       // OTP code sent to email
  string channel_type = 3;                   // "telephony" or "whatsapp"
}

// Channel verify registration response - activates account and returns tokens
message ChannelVerifyRegistrationResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;                   // JWT access token
  string refresh_token = 4;                  // Refresh token
  string user_id = 5;                        // User ID
  string account_id = 6;                     // Primary account ID
  string currency = 7;                       // Default currency
  string user_country = 8;                   // User country code
  int32 expires_in = 9;                     // Token expiry in seconds
}

// ===== Telephony Voice Agent Authentication =====

// Admin: Generate token for user by phone number (for telephony voice agents)
message AdminGenerateTokenByPhoneRequest {
  string phone_number = 1;    // E.164 format phone number (e.g., +234XXXXXXXX)
  string admin_secret = 2;    // ADMIN_SECRET_KEY environment variable for security
  string channel_type = 3;    // "telephony" or "whatsapp" - for logging/tracking
}

message AdminGenerateTokenByPhoneResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;    // JWT access token for voice agent
  string refresh_token = 4;   // Refresh token
  string user_id = 5;         // User ID (UUID)
  string account_id = 6;      // Primary account ID (UUID)
  string currency = 7;        // Default currency (NGN, USD, etc.)
  string user_country = 8;    // User country code (NG, US, etc.)
  int32 expires_in = 9;       // Token expiry in seconds
  bool user_found = 10;       // False if phone not found in system
  string first_name = 11;     // User's first name for personalized greeting
  string last_name = 12;      // User's last name
}
