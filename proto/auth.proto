syntax = "proto3";

// Must match core-gateway and Flutter (pb.AuthService) so gRPC full method names align on the wire.
package pb;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
// VerifyPasscodeRequest/Response are defined in user.proto (same `pb` package);
// reused here for the AuthService.VerifyPasscode RPC the gateway proxies to.
import "user.proto";

option go_package = "lazervaultGo/pb";

// OpenAPI v2 documentation
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "LazerVault Auth Service";
    version: "1.0";
    description: "Authentication and authorization service for LazerVault";
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Bearer token authentication";
      }
    }
  };
};

// Auth Service - Complete authentication and authorization
service AuthService {
  // User registration
  rpc Signup(SignupRequest) returns (SignupResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/signup"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "User Registration";
      description: "Register a new user account";
      tags: ["Authentication"];
    };
  }

  // User login
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "User Login";
      description: "Login with email and password";
      tags: ["Authentication"];
    };
  }

  // Refresh access token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Refresh Token";
      description: "Refresh access token using refresh token";
      tags: ["Authentication"];
    };
  }

  // Logout user
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "User Logout";
      description: "Logout and invalidate refresh token";
      tags: ["Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Email verification
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-email"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Email";
      description: "Verify email address with token";
      tags: ["Authentication"];
    };
  }

  // Phone verification
  rpc VerifyPhone(VerifyPhoneRequest) returns (VerifyPhoneResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-phone"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Phone";
      description: "Verify phone number with OTP code";
      tags: ["Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Request password reset (supports email or SMS)
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/forgot-password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Forgot Password";
      description: "Request password reset via email or SMS. Sends a 6-digit OTP for SMS or reset token for email.";
      tags: ["Authentication"];
    };
  }

  // Verify password reset code (for SMS OTP or email token)
  rpc VerifyPasswordResetCode(VerifyPasswordResetCodeRequest) returns (VerifyPasswordResetCodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-password-reset-code"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Password Reset Code";
      description: "Verify password reset code (6-digit OTP for SMS or UUID token for email). Returns a reset token on success.";
      tags: ["Authentication"];
    };
  }

  // Reset password with token
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/reset-password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Reset Password";
      description: "Reset password using verification token received after code verification";
      tags: ["Authentication"];
    };
  }

  // Get current user info
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Current User";
      description: "Get currently authenticated user information";
      tags: ["User"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // GetMyInsurancePrefill returns the AUTHENTICATED caller's OWN verified KYC
  // identity (name/email/phone/DOB + nin/bvn) for the insurance create-policy
  // form to prefill the customer-info section (editable). user_id comes from
  // the JWT context, never the request — a user can only read their own data.
  rpc GetMyInsurancePrefill(GetMyInsurancePrefillRequest) returns (GetMyInsurancePrefillResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/me/insurance-prefill"
    };
  }

  // Update user profile
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/auth/profile"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update User Profile";
      description: "Update the authenticated user's profile information";
      tags: ["User"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Facial recognition login
  rpc FacialLogin(FacialLoginRequest) returns (FacialLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/facial-login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Facial Login";
      description: "Login using facial recognition";
      tags: ["Authentication"];
    };
  }

  // Social login (Google, Facebook, Apple)
  rpc SocialLogin(SocialLoginRequest) returns (SocialLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/social-login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Social Login";
      description: "Login with social provider (Google, Facebook, Apple)";
      tags: ["Authentication"];
    };
  }

  // Enable two-factor authentication
  rpc EnableTwoFactor(EnableTwoFactorRequest) returns (EnableTwoFactorResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/enable"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Enable 2FA";
      description: "Enable two-factor authentication";
      tags: ["Two-Factor Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Verify two-factor authentication
  rpc VerifyTwoFactor(VerifyTwoFactorRequest) returns (VerifyTwoFactorResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/verify"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify 2FA";
      description: "Verify two-factor authentication code";
      tags: ["Two-Factor Authentication"];
    };
  }

  // Complete two-factor authentication setup
  rpc CompleteTwoFactorSetup(CompleteTwoFactorSetupRequest) returns (CompleteTwoFactorSetupResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/complete-setup"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Complete 2FA Setup";
      description: "Complete 2FA setup by verifying the initial code";
      tags: ["Two-Factor Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Disable two-factor authentication
  rpc DisableTwoFactor(DisableTwoFactorRequest) returns (DisableTwoFactorResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/disable"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Disable 2FA";
      description: "Disable two-factor authentication. Requires 2FA code verification.";
      tags: ["Two-Factor Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Get two-factor authentication status
  rpc GetTwoFactorStatus(GetTwoFactorStatusRequest) returns (GetTwoFactorStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/2fa/status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get 2FA Status";
      description: "Get current two-factor authentication status";
      tags: ["Two-Factor Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Regenerate two-factor backup codes
  rpc RegenerateBackupCodes(RegenerateBackupCodesRequest) returns (RegenerateBackupCodesResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/regenerate-codes"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Regenerate Backup Codes";
      description: "Regenerate two-factor backup codes";
      tags: ["Two-Factor Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Send two-factor authentication code (for SMS/Email methods)
  rpc SendTwoFactorCode(SendTwoFactorCodeRequest) returns (SendTwoFactorCodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/send-code"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Send 2FA Code";
      description: "Send a new two-factor authentication code via SMS or email";
      tags: ["Two-Factor Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Get available two-factor authentication methods
  rpc GetAvailable2FAMethods(GetAvailable2FAMethodsRequest) returns (GetAvailable2FAMethodsResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/2fa/methods"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Available 2FA Methods";
      description: "Get list of available two-factor authentication methods";
      tags: ["Two-Factor Authentication"];
    };
  }

  // Validate token (used by gateway)
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/validate-token"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Validate Token";
      description: "Validate JWT token (internal use by gateway)";
      tags: ["Internal"];
    };
  }

  // Resend verification email
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/resend-verification"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Resend Verification Email";
      description: "Resend email verification link";
      tags: ["Authentication"];
    };
  }

  // Resend phone verification SMS
  rpc ResendPhoneVerification(ResendPhoneVerificationRequest) returns (ResendPhoneVerificationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/resend-phone-verification"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Resend Phone Verification";
      description: "Resend phone verification SMS code";
      tags: ["Authentication"];
    };
  }

  // Change password (authenticated)
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/change-password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Change Password";
      description: "Change user password (requires old password)";
      tags: ["Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Channel login - authenticate via phone number for SMS/WhatsApp/Phone banking
  rpc ChannelLogin(ChannelLoginRequest) returns (ChannelLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/channel-login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Channel Login";
      description: "Authenticate user via phone number for SMS, WhatsApp, or Phone banking channels. Returns access token for channel operations.";
      tags: ["Channel Authentication"];
    };
  }

  // Channel register - register new user via phone channel
  rpc ChannelRegister(ChannelRegisterRequest) returns (ChannelRegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/channel-register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Channel Register";
      description: "Register a new user account via phone channel (SMS/WhatsApp/Phone). Sends OTP to email for verification.";
      tags: ["Channel Authentication"];
    };
  }

  // Channel verify registration - verify OTP for new user registration
  rpc ChannelVerifyRegistration(ChannelVerifyRegistrationRequest) returns (ChannelVerifyRegistrationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/channel-verify-registration"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Channel Verify Registration";
      description: "Verify OTP sent during channel registration and activate the account";
      tags: ["Channel Authentication"];
    };
  }

  // Admin: Generate JWT token for user by phone number (for telephony/WhatsApp voice agents)
  rpc AdminGenerateTokenByPhone(AdminGenerateTokenByPhoneRequest) returns (AdminGenerateTokenByPhoneResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/token-by-phone"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Admin Generate Token by Phone";
      description: "Generate JWT token for user by phone number using admin secret. Used by telephony voice agents to authenticate callers.";
      tags: ["Admin", "Channel Authentication"];
    };
  }

  // Login with passcode
  rpc LoginWithPasscode(LoginWithPasscodeRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login with Passcode";
      description: "Login using passcode instead of password";
      tags: ["Authentication"];
    };
  }

  // Public: complete an adaptive step-up login by verifying the login OTP.
  rpc VerifyLoginOtp(VerifyLoginOtpRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-login-otp"
      body: "*"
    };
  }

  // Register passcode
  rpc RegisterPasscode(RegisterPasscodeRequest) returns (RegisterPasscodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Register Passcode";
      description: "Register a passcode for quick login";
      tags: ["Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Change passcode
  rpc ChangePasscode(ChangePasscodeRequest) returns (ChangePasscodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/change-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Change Passcode";
      description: "Change user passcode";
      tags: ["Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Device permissions audit — mirrors auth-service.
  rpc UpdateDevicePermissions(AuthUpdateDevicePermissionsRequest) returns (AuthUpdateDevicePermissionsResponse);
  rpc GetDevicePermissions(AuthGetDevicePermissionsRequest) returns (AuthGetDevicePermissionsResponse);

  // Verify passcode (read-only; no session change). Mirrors auth-service.
  rpc VerifyPasscode(VerifyPasscodeRequest) returns (VerifyPasscodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Passcode";
      description: "Verify the current login passcode without minting a session";
      tags: ["Authentication"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Request password reset
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/request-password-reset"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Request Password Reset";
      description: "Request password reset email";
      tags: ["Authentication"];
    };
  }

  // Request email verification
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/request-email-verification"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Request Email Verification";
      description: "Request email verification email";
      tags: ["Authentication"];
    };
  }

  // Check email availability
  rpc CheckEmailAvailability(CheckEmailAvailabilityRequest) returns (CheckEmailAvailabilityResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/check-email-availability"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Check Email Availability";
      description: "Check if email is available for registration";
      tags: ["Authentication"];
    };
  }

  // Request phone verification
  rpc RequestPhoneVerification(RequestPhoneVerificationRequest) returns (RequestPhoneVerificationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/request-phone-verification"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Request Phone Verification";
      description: "Request phone verification code";
      tags: ["Authentication"];
    };
  }

  // Verify phone number
  rpc VerifyPhoneNumber(VerifyPhoneNumberRequest) returns (VerifyPhoneNumberResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-phone-number"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Phone Number";
      description: "Verify phone number with code";
      tags: ["Authentication"];
    };
  }

  // Get signup progress for authenticated user
  rpc GetSignupProgress(GetSignupProgressRequest) returns (GetSignupProgressResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/signup-progress"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Signup Progress";
      description: "Get current signup flow progress for authenticated user";
      tags: ["Signup Progress"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Update signup step progress
  rpc UpdateSignupStep(UpdateSignupStepRequest) returns (UpdateSignupStepResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/signup-progress/step"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update Signup Step";
      description: "Mark a signup step as complete or update its status";
      tags: ["Signup Progress"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Complete signup flow
  rpc CompleteSignup(CompleteSignupRequest) returns (CompleteSignupResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/signup-progress/complete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Complete Signup";
      description: "Mark signup flow as complete after all steps finished";
      tags: ["Signup Progress"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Verify identity (BVN or NIN) - Synchronous flow during signup
  rpc VerifyIdentity(VerifyIdentityRequest) returns (VerifyIdentityResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-identity"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Identity";
      description: "Verify user identity using BVN or NIN. This is a synchronous operation that verifies with the banking service and creates a virtual account on success.";
      tags: ["Identity Verification"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Get identity verification status
  rpc GetIdentityVerificationStatus(GetIdentityVerificationStatusRequest) returns (GetIdentityVerificationStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/identity-status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Identity Verification Status";
      description: "Get the current identity verification status for the authenticated user";
      tags: ["Identity Verification"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Initiate KYC verification flow
  rpc InitiateKYC(InitiateKYCRequest) returns (InitiateKYCResponse) {
    option (google.api.http) = {
      post: "/api/v1/kyc/initiate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Initiate KYC";
      description: "Initiate a KYC verification flow for a specific tier. Returns required documents and fields.";
      tags: ["KYC"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Upload KYC document
  rpc UploadDocument(UploadDocumentRequest) returns (UploadDocumentResponse) {
    option (google.api.http) = {
      post: "/api/v1/kyc/upload-document"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Upload Document";
      description: "Upload a KYC document for verification. Supports ID cards, selfies, and proof of address.";
      tags: ["KYC"];
      security: {
        security_requirement: {
          key: "bearer";
        }
      };
    };
  }

  // Skip KYC upgrade (progressive onboarding)
