  // ===== Account deletion (in-app self-service — required by both app stores) =====
  // Initiate deletion of the CALLING user's account (JWT-identified). Blocked
  // when the user still holds funds/active holds (error_code = FUNDS_PRESENT).
  // Otherwise starts a cancellable grace period and revokes the user's sessions.
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (RequestAccountDeletionResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/account/delete"
      body: "*"
    };
  }

  // Cancel a pending account deletion within the grace window (JWT-identified).
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (CancelAccountDeletionResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/account/delete/cancel"
      body: "*"
    };
  }

  // ===== Account self-lock (Settings → Security) =====
  // Arm a user-initiated login + transaction lock for a timeframe (JWT-identified).
  // No early unlock — it elapses. Blocks login (after creds, before 2FA) AND
  // money movement (accounts-service gates debits/holds on the same window).
  rpc RequestAccountLock(RequestAccountLockRequest) returns (RequestAccountLockResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/account/lock"
      body: "*"
    };
  }
}

// ===== Account self-lock =====
message RequestAccountLockRequest {
  int32 duration_seconds = 1;  // clamped server-side to 1h..30d
  string reason = 2;           // optional
}
message RequestAccountLockResponse {
  bool success = 1;
  string locked_until = 2;     // ISO 8601 — when the lock elapses
  string message = 3;
}

// ===== Account deletion =====
message RequestAccountDeletionRequest {
  // User is identified via the JWT; no user_id in the body. Optional free-text
  // reason captured for the deletion audit log.
  string reason = 1;
}
message RequestAccountDeletionResponse {
  bool success = 1;
  string status = 2;             // "pending_deletion" on success
  string scheduled_at = 3;       // ISO 8601 — when the account is finalized
  int32 grace_period_days = 4;   // cancellable window
  string message = 5;
  string error_code = 6;         // "FUNDS_PRESENT" when blocked by a balance/hold
}
message CancelAccountDeletionRequest {}
message CancelAccountDeletionResponse {
  bool success = 1;
  string status = 2;             // "none" once restored
  string message = 3;
}

// ===== Signup =====
// Enum to specify primary contact method for signup
enum PrimaryContactType {
  EMAIL = 0;   // User signed up with email (default)
  PHONE = 1;   // User signed up with phone number
}

message SignupRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;                              // E.164 format (e.g., +12345678901)
  string device_id = 6;
  string device_name = 7;
  PrimaryContactType primary_contact_type = 8;   // Which contact method user chose first
  string username = 9;                          // Optional username
  string referral_code = 10;                     // Optional referral code
  string date_of_birth = 11;                     // ISO 8601 date (YYYY-MM-DD)
  string locale = 12;                           // Locale format: "en-NG", "en-US", etc. Backend will derive country/currency
  string bvn = 13;                               // Bank Verification Number (11 digits, Nigeria)
  string nin = 14;                               // National Identification Number (11 digits, Nigeria)

  // Deprecated: Use locale instead. Frontend should only send locale.
  // Kept for backward compatibility during migration.
  string country_code = 15 [deprecated = true];  // ISO country code (e.g., "NG" for Nigeria)
  string currency_code = 16 [deprecated = true]; // ISO currency code (e.g., "NGN" for Naira)
}

message SignupResponse {
  string user_id = 1;
  string email = 2;
  string message = 3;
  bool email_verification_required = 4;          // True if email needs verification
  string access_token = 5;
  string refresh_token = 6;
  int64 expires_in = 7;
  User user = 8;
  bool phone_verification_required = 9;          // True if phone needs verification
  string verification_sent_to = 10;              // Email or phone where verification was sent
  string phone_verification_id = 11;             // Verification ID for phone OTP (used for verify endpoint)
  int64 phone_verification_expires_in = 12;      // Seconds until phone verification code expires
}

// ===== Login =====
message LoginRequest {
  string email = 1;                 // Email OR phone number (specify one)
  string password = 2;
  string device_id = 3;
  string device_name = 4;
  string phone = 5;                 // Alternative to email for login
}

message LoginResponse {
  bool success = 1;
  string msg = 2;
  string access_token = 3;
  string refresh_token = 4;
  int64 expires_in = 5;
  LoginData data = 6;
  bool two_factor_required = 7;
  string two_factor_token = 8; // Temporary token for 2FA flow
  bool step_up_required = 9;
  string step_up_token = 10;
  string step_up_method = 11;
  string step_up_destination = 12;
  string two_factor_method = 13;
}

message LoginData {
  User user = 1;
  Session session = 2;
  bool has_passcode = 3;
  bool has_transaction_pin = 4;
  bool has_password = 5;
}

message Session {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string user_id = 4;
}

