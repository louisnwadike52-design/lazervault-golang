syntax = "proto3";

package auth;
option go_package = "lazervaultGo/pb";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "common.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "LazerVault API"
        version: "1.0"
        description: "LazerVault Authentication API"
    }
    schemes: HTTP
    schemes: HTTPS
    consumes: "application/json"
    produces: "application/json"
};


message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginWithPasscodeRequest {
  string email = 1;
  string login_passcode = 2; // 4-6 digit passcode
}

message RegisterPasscodeRequest {
  string login_passcode = 1; // 6-digit passcode to register
}

message RegisterPasscodeResponse {
  bool success = 1;
  string msg = 2;
}

message ChangePasscodeRequest {
  string old_passcode = 1; // Current 6-digit passcode
  string new_passcode = 2; // New 6-digit passcode
}

message ChangePasscodeResponse {
  bool success = 1;
  string msg = 2;
}

message LoginResponse {
  pb.Data data = 1;
  bool success = 2;
  string msg = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  pb.Data data = 1;
  bool success = 2;     
  string msg = 3;
}   

message LogoutRequest {
  string session_id = 1;
}

message LogoutResponse {
  bool success = 1;
  string msg = 2;
}

// --- Email Verification Messages ---

// Request to send a verification email to the authenticated user.
// No parameters needed as user is identified via auth token.
message RequestEmailVerificationRequest {}

// Response for requesting email verification.
message RequestEmailVerificationResponse {
  bool success = 1; // Indicates if the request was accepted (email sending enqueued)
  string msg = 2;   // User-facing message (e.g., "Verification email sent")
}

// Request to verify an email using a received code.
message VerifyEmailRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["verification_code"]
    }
  };
  string verification_code = 1; // The verification code sent to the user's email
}

// Response for verifying an email.
message VerifyEmailResponse {
  bool success = 1; // Indicates if the email was successfully verified
  string msg = 2;   // User-facing message (e.g., "Email verified successfully")
}

// --- End Email Verification Messages ---

// --- Password Reset Messages (Email/Token Based) ---

// Request to initiate password reset process via email or SMS.
message RequestPasswordResetRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["email"]
    }
  };
  // User provides their email to initiate reset.
  string email = 1;
  // Delivery method for OTP: "EMAIL" or "SMS" (default: "SMS")
  string delivery_method = 2;
}

// Response for requesting password reset.
message RequestPasswordResetResponse {
  bool success = 1;
  string msg = 2; // e.g., "Password reset instructions sent to your email."
}

// Request to reset password using the email token.
message ResetPasswordRequest {
 option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["email", "token", "new_password"]
    }
  };
  string email = 1;        // Email used in the initial request
  string token = 2;        // The reset token received via email
  string new_password = 3; // The desired new password
}

// Response for resetting password.
message ResetPasswordResponse {
  bool success = 1;
  string msg = 2; // e.g., "Password reset successfully."
}

// Request to verify password reset code (6-digit OTP)
message VerifyPasswordResetCodeRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["email", "code"]
    }
  };
  string email = 1; // Email used in the reset request
  string code = 2;  // 6-digit OTP code
}

// Response for verifying password reset code
message VerifyPasswordResetCodeResponse {
  bool success = 1;
  string msg = 2;
  string reset_token = 3; // Temporary token for password reset (valid 15 minutes)
}

// --- End Password Reset Messages ---

// --- Facial Recognition Messages ---

// Request to login with facial recognition
message LoginWithFaceRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["email", "image_data"]
    }
  };
  string email = 1;
  bytes image_data = 2;
  string image_filename = 3;
}

// Response for facial recognition login
message LoginWithFaceResponse {
  pb.Data data = 1;
  bool success = 2;
  string msg = 3;
  double confidence = 4; // Confidence score from facial recognition
}

// Request to check if user has facial recognition enabled
message CheckFaceRegistrationRequest {
  // User identified via auth token, no parameters needed
}

// Response for checking face registration status
message CheckFaceRegistrationResponse {
  bool is_registered = 1;
  string registered_at = 2; // ISO 8601 timestamp
  string msg = 3;
}

// --- End Facial Recognition Messages ---

// --- Social Sign-In Messages ---
message SignInWithGoogleRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id_token"]
    }
  };
  // The ID token received from Google Sign-In on the client.
  string id_token = 1;
}

message SignInWithAppleRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["identity_token", "user_identifier"]
      // Optional: Include email and name if you want the client to send them
      // when first available from Apple. The backend should prioritize
      // verification via identity_token.
    }
  };
  // The identity token received from Sign in with Apple on the client.
  string identity_token = 1;
  // The unique user identifier received from Apple.
  string user_identifier = 2;
  // Optional: Email provided by Apple (usually only on first sign-in).
  string email = 3;
  // Optional: Given name provided by Apple.
  string given_name = 4;
  // Optional: Family name provided by Apple.
  string family_name = 5;
}

// We can reuse LoginResponse for social sign-in success.

// --- End Social Sign-In Messages ---

// --- Email Availability Check ---
message CheckEmailAvailabilityRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["email"]
    }
  };
  string email = 1; // The email to check for availability
}

message CheckEmailAvailabilityResponse {
  bool available = 1; // Indicates if the email is available (true) or already in use (false)
  string msg = 2;     // User-facing message (e.g., "Email is available" or "Email already in use")
}

// --- PIN Verification ---
message VerifyPinRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["pin"]
    }
  };
  string pin = 1; // The 4-digit transaction PIN entered by the user
}

message VerifyPinResponse {
  bool success = 1; // Indicates if the PIN was correct
  string msg = 2;   // e.g., "PIN verified successfully."
}

// --- Signup Messages ---
message SignupRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string device_id = 6;
  string device_name = 7;
  string username = 9;
  string referral_code = 10;
  string date_of_birth = 11;
  string locale = 12;
  string bvn = 13;
  string nin = 14;
  string country_code = 15;
  string currency_code = 16;
}

message SignupResponse {
  string user_id = 1;
  string email = 2;
  string message = 3;
  bool email_verification_required = 4;
  string access_token = 5;
  string refresh_token = 6;
  int64 expires_in = 7;
  pb.User user = 8;
  bool phone_verification_required = 9;
  string verification_sent_to = 10;
  string phone_verification_id = 11;
  int64 phone_verification_expires_in = 12;
}

// --- Forgot Password Messages ---
message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  string message = 1;
}

// --- Change Password Messages ---
message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  string message = 1;
}

// --- Validate Token Messages ---
message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  int64 expires_at = 4;
}

// --- Resend Verification Email Messages ---
message ResendVerificationEmailRequest {
  string email = 1;
}

message ResendVerificationEmailResponse {
  bool success = 1;
  string message = 2;
  int32 cooldown_seconds = 3;
}

// --- Request Phone Verification Messages ---
message RequestPhoneVerificationRequest {
  string phone = 1;
  string country_code = 2;
}

message RequestPhoneVerificationResponse {
  bool success = 1;
  string msg = 2;
  string verification_id = 3;
  int64 expires_in = 4;
}

// --- Verify Phone Number Messages ---
message VerifyPhoneNumberRequest {
  string phone = 1;
  string country_code = 2;
  string code = 3;
  string verification_id = 4;
}

message VerifyPhoneNumberResponse {
  bool success = 1;
  string msg = 2;
  bool is_verified = 3;
}

// --- Identity Verification Messages ---
enum IdentityType {
  IDENTITY_TYPE_UNSPECIFIED = 0;
  IDENTITY_TYPE_BVN = 1;
  IDENTITY_TYPE_NIN = 2;
  IDENTITY_TYPE_GHANA_CARD = 3;
  IDENTITY_TYPE_KENYA_NATIONAL_ID = 4;
  IDENTITY_TYPE_KRA_PIN = 5;
  IDENTITY_TYPE_SA_ID = 6;
  IDENTITY_TYPE_SA_PASSPORT = 7;
  IDENTITY_TYPE_UK_PASSPORT = 8;
  IDENTITY_TYPE_UK_DRIVING_LICENSE = 9;
  IDENTITY_TYPE_US_SSN = 10;
  IDENTITY_TYPE_US_STATE_ID = 11;
  IDENTITY_TYPE_US_PASSPORT = 12;
  IDENTITY_TYPE_DRIVERS_LICENSE = 13;
  IDENTITY_TYPE_INTERNATIONAL_PASSPORT = 14;
}

message VerifyIdentityRequest {
  IdentityType identity_type = 1;
  string identity_number = 2;
  string date_of_birth = 3;
}

message VerifiedIdentity {
  string first_name = 1;
  string last_name = 2;
  string middle_name = 3;
  string phone_number = 4;
  string date_of_birth = 5;
  string gender = 6;
  string photo_url = 7;
  string address = 8;
  string state_of_origin = 9;
  string lga_of_origin = 10;
}

message VirtualAccountInfo {
  string account_number = 1;
  string bank_name = 2;
  string bank_code = 3;
  string account_name = 4;
  string currency = 5;
  string provider = 6;
}

message VerifyIdentityResponse {
  bool success = 1;
  bool verified = 2;
  string error_code = 3;
  string error_message = 4;
  VerifiedIdentity identity = 5;
  VirtualAccountInfo virtual_account = 6;
}

// --- Get Identity Verification Status Messages ---
message GetIdentityVerificationStatusRequest {
  // User ID extracted from JWT
}

message GetIdentityVerificationStatusResponse {
  bool success = 1;
  string msg = 2;
  bool identity_verified = 3;
  IdentityType identity_type = 4;
  string identity_verified_at = 5;
  string masked_identity_number = 6;
}

// Service Definition
service AuthService {
  // --- Signup ---
  rpc Signup(SignupRequest) returns (SignupResponse) {
    option (google.api.http) = {
      post: "/v1/auth/signup"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // --- Forgot Password ---
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/forgot-password"
      body: "*"
    };
  }

  // --- Change Password ---
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/change-password"
      body: "*"
    };
  }

  // --- Validate Token ---
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/validate-token"
      body: "*"
    };
  }

  // --- Resend Verification Email ---
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/resend-verification-email"
      body: "*"
    };
  }

  // --- Request Phone Verification ---
  rpc RequestPhoneVerification(RequestPhoneVerificationRequest) returns (RequestPhoneVerificationResponse) {
    option (google.api.http) = {
      post: "/v1/auth/request-phone-verification"
      body: "*"
    };
  }

  // --- Verify Phone Number ---
  rpc VerifyPhoneNumber(VerifyPhoneNumberRequest) returns (VerifyPhoneNumberResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-phone-number"
      body: "*"
    };
  }

  // --- Verify Identity ---
  rpc VerifyIdentity(VerifyIdentityRequest) returns (VerifyIdentityResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-identity"
      body: "*"
    };
  }

  // --- Get Identity Verification Status ---
  rpc GetIdentityVerificationStatus(GetIdentityVerificationStatusRequest) returns (GetIdentityVerificationStatusResponse) {
    option (google.api.http) = {
      get: "/v1/auth/identity-status"
    };
  }

  rpc LoginWithPasscode(LoginWithPasscodeRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login with Passcode"
      description: "Authenticates a user using their email and login passcode."
      tags: ["Auth"]
    };
  }

  rpc RegisterPasscode(RegisterPasscodeRequest) returns (RegisterPasscodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Register Passcode"
      description: "Registers a login passcode for the authenticated user."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  rpc ChangePasscode(ChangePasscodeRequest) returns (ChangePasscodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/change-passcode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Change Passcode"
      description: "Changes the login passcode for the authenticated user."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh-token"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // --- Email Verification RPCs ---

  // Request sending a verification email to the authenticated user.
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse) {
    option (google.api.http) = {
      post: "/v1/auth/request-verification-email"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Request Email Verification"
      description: "Initiates the process to send a verification email to the authenticated user's registered email address."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // Verify the user's email address using a verification code.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-email"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Email"
      description: "Verifies the user's email address using the provided verification code."
      tags: ["Auth"]
      // No explicit security requirement here, as the code itself implies user action.
      // However, the backend service MUST validate the code properly.
    };
  }

  // --- End Email Verification RPCs ---

  // --- Password Reset RPCs (Email/Token Based) ---

  // Initiate password reset by sending an email token.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/v1/auth/request-password-reset"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Request Password Reset (Email)"
      description: "Initiates the password reset process by sending an email with a reset link/token to the user's registered email address."
      tags: ["Auth"]
    };
  }

  // Reset the user's password using the email token.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/reset-password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Reset Password (Email Token)"
      description: "Resets the user's password after verifying the email and the reset token received via email."
      tags: ["Auth"]
    };
  }

  // Verify password reset code (6-digit OTP)
  rpc VerifyPasswordResetCode(VerifyPasswordResetCodeRequest) returns (VerifyPasswordResetCodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-password-reset-code"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Password Reset Code"
      description: "Verifies the 6-digit OTP code received via email/SMS and returns a temporary reset token."
      tags: ["Auth"]
    };
  }

  // --- End Password Reset RPCs ---

  // --- Facial Recognition RPCs ---

  // Login with facial recognition
  rpc LoginWithFace(LoginWithFaceRequest) returns (LoginWithFaceResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login-face"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login with Face Recognition"
      description: "Authenticates a user using facial recognition."
      tags: ["Auth"]
    };
  }

  // Check if user has facial recognition enabled
  rpc CheckFaceRegistration(CheckFaceRegistrationRequest) returns (CheckFaceRegistrationResponse) {
    option (google.api.http) = {
      post: "/v1/auth/check-face-registration"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Check Face Registration Status"
      description: "Checks if the authenticated user has facial recognition enabled."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // --- End Facial Recognition RPCs ---

  // --- Social Sign-In RPCs ---
  rpc SignInWithGoogle(SignInWithGoogleRequest) returns (LoginResponse) {
     option (google.api.http) = {
       post: "/v1/auth/google/signin"
       body: "*"
     };
     option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
       summary: "Sign In/Up with Google"
       description: "Authenticates a user using a Google ID token. Creates an account if one doesn't exist for the Google user."
       tags: ["Auth"]
     };
  }

  rpc SignInWithApple(SignInWithAppleRequest) returns (LoginResponse) {
     option (google.api.http) = {
       post: "/v1/auth/apple/signin"
       body: "*"
     };
     option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
       summary: "Sign In/Up with Apple"
       description: "Authenticates a user using Apple credentials. Creates an account if one doesn't exist for the Apple user."
       tags: ["Auth"]
     };
  }
  // --- End Social Sign-In RPCs ---

  // --- Email Availability Check RPC ---
  rpc CheckEmailAvailability(CheckEmailAvailabilityRequest) returns (CheckEmailAvailabilityResponse) {
    option (google.api.http) = {
      post: "/v1/auth/check-email-availability"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Check Email Availability"
      description: "Checks if an email address is available for registration or already in use."
      tags: ["Auth"]
    };
  }
  // --- End Email Availability Check RPC ---

  // Verify the user's transaction PIN.
  rpc VerifyPin(VerifyPinRequest) returns (VerifyPinResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-pin"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify Transaction PIN"
      description: "Verifies the authenticated user's transaction PIN."
      tags: ["Auth"]
      security: { // Requires authentication
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // --- User Profile RPCs ---

  // Get authenticated user's profile
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Current User"
      description: "Gets the profile of the currently authenticated user."
      tags: ["User"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // Update authenticated user's profile
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/v1/auth/profile"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update Profile"
      description: "Updates the profile of the currently authenticated user."
      tags: ["User"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // --- User Lookup RPCs ---

  // Lookup user by username (LazerTag)
  rpc LookupUserByUsername(LookupUserByUsernameRequest) returns (LookupUserByUsernameResponse) {
    option (google.api.http) = {
      get: "/v1/users/lookup/username/{username}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Lookup User by Username"
      description: "Finds a user by their LazerTag username for transfers."
      tags: ["User"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // Search users by name, username, email, or phone number
  rpc SearchUsers(UserSearchRequest) returns (UserSearchResponse) {
    option (google.api.http) = {
      get: "/v1/auth/search/users"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Search Users"
      description: "Search for users by name, username, email, or phone number. Supports multi-field search with optional search_type filter."
      tags: ["User Lookup"]
      security: {
        security_requirement: {
          key: "bearer" value: {}
        }
      }
    };
  }

  // --- KYC Phase 2 RPCs ---

  rpc GetKYCStatus(GetKYCStatusRequest) returns (GetKYCStatusResponse) {
    option (google.api.http) = { get: "/api/v1/kyc/status" };
  }

  rpc GetCountryRequirements(GetCountryRequirementsRequest) returns (GetCountryRequirementsResponse) {
    option (google.api.http) = { get: "/api/v1/kyc/requirements/{country_code}" };
  }

  rpc CreateVerificationSession(CreateVerificationSessionRequest) returns (CreateVerificationSessionResponse) {
    option (google.api.http) = { post: "/api/v1/kyc/verify" body: "*" };
  }

  rpc ConfirmVerification(ConfirmVerificationRequest) returns (ConfirmVerificationResponse) {
    option (google.api.http) = { post: "/api/v1/kyc/confirm" body: "*" };
  }

  rpc GetDocumentUploadURL(GetDocumentUploadURLRequest) returns (GetDocumentUploadURLResponse) {
    option (google.api.http) = { post: "/api/v1/kyc/upload-url" body: "*" };
  }

  rpc SubmitDocumentsForReview(SubmitDocumentsForReviewRequest) returns (SubmitDocumentsForReviewResponse) {
    option (google.api.http) = { post: "/api/v1/kyc/submit-documents" body: "*" };
  }

  rpc ConfirmBVNName(ConfirmBVNNameRequest) returns (ConfirmBVNNameResponse) {
    option (google.api.http) = { post: "/api/v1/kyc/confirm-bvn-name" body: "*" };
  }
}

// --- User Profile Messages ---
// AuthUser mirrors the auth-service's User message field layout exactly.
// The auth-service uses different field numbers/types than common.proto User,
// so we define this separate type for wire compatibility with the auth-service.
message AuthUser {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string country_code = 6;
  bool email_verified = 7;
  bool phone_verified = 8;
  bool two_factor_enabled = 9;
  string two_factor_method = 10;
  string profile_picture = 11;
  string created_at = 12;
  string updated_at = 13;
  string signup_status = 14;
  string current_signup_step = 15;
  string username = 16;
  bool identity_verified = 17;
  string identity_type = 18;
  string identity_verified_at = 19;
  string date_of_birth = 20;
}

message GetMeRequest {
  string user_id = 1; // User ID (from JWT context in proxy)
}

message GetMeResponse {
  AuthUser user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;          // User ID (from JWT context)
  string first_name = 2;       // New first name (optional)
  string last_name = 3;        // New last name (optional)
  string username = 4;         // New username/LazerTag (optional)
  string phone = 5;            // New phone number (optional)
  string profile_picture = 6;  // New profile picture URL (optional)
}

message UpdateProfileResponse {
  bool success = 1;
  string msg = 2;
  AuthUser user = 3;
}

// --- User Lookup Messages ---

message LookupUserByUsernameRequest {
  string username = 1;
}

// UserLookupResponse - common response for username and phone lookups
message LookupUserByUsernameResponse {
  bool success = 1;
  string msg = 2;
  bool found = 3;
  AuthUserLookupResult user = 4;
}

message UserSearchRequest {
  string query = 1;
  int32 limit = 2;
  string search_type = 3;
  string country_code = 4;            // Optional: filter results to only users in this country/locale
}

message UserSearchResponse {
  bool success = 1;
  string msg = 2;
  repeated AuthUserLookupResult users = 3;
}

message AuthUserLookupResult {
  string user_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  string profile_picture = 5;
  bool is_lazervault_user = 6;
  string phone_number = 7;
  string email = 8;
  string primary_account_id = 9;
  string country_code = 10;           // User's country code (e.g., "NG", "US")
}

// ===== KYC Phase 2 Messages =====

enum KYCTier {
  KYC_TIER_UNKNOWN = 0;
  KYC_TIER_1 = 1;
  KYC_TIER_2 = 2;
  KYC_TIER_3 = 3;
}

enum KYCVerificationStatus {
  KYC_STATUS_UNKNOWN = 0;
  KYC_STATUS_NOT_STARTED = 1;
  KYC_STATUS_IN_PROGRESS = 2;
  KYC_STATUS_PENDING_REVIEW = 3;
  KYC_STATUS_APPROVED = 4;
  KYC_STATUS_REJECTED = 5;
  KYC_STATUS_EXPIRED = 6;
}

message KYCTierInfo {
  KYCTier tier = 1;
  KYCVerificationStatus status = 2;
  string display_name = 3;
  string description = 4;
  repeated string benefits = 5;
  int64 daily_transaction_limit = 6;
  int64 daily_receive_limit = 7;
  int64 max_balance = 8;
  string verified_at = 9;
  string expires_at = 10;
  bool is_current = 11;
  bool is_locked = 12;
}

message GetKYCStatusRequest {}

message GetKYCStatusResponse {
  bool success = 1;
  KYCVerificationStatus status = 2;
  KYCTier current_tier = 3;
  repeated KYCTierInfo tier_info = 4;
  string last_updated = 5;
  string rejection_reason = 6;
}

message CountryKYCRequirements {
  string country_code = 1;
  repeated IdentityType accepted_id_types = 2;
  repeated IdentityType mandatory_id_types = 3;
  bool address_proof_required = 4;
  bool liveness_check_required = 5;
  int64 tier_1_daily_limit = 6;
  int64 tier_2_daily_limit = 7;
  int64 tier_3_daily_limit = 8;
}

message GetCountryRequirementsRequest {
  string country_code = 1;
}

message GetCountryRequirementsResponse {
  bool success = 1;
  CountryKYCRequirements requirements = 2;
}

message CreateVerificationSessionRequest {
  KYCTier target_tier = 1;
  string country_code = 2;
  IdentityType id_type = 3;
  string id_number = 4;
  string first_name = 5;
  string last_name = 6;
  string date_of_birth = 7;
  string phone_number = 8;
}

message CreateVerificationSessionResponse {
  bool success = 1;
  string verification_id = 2;
  string session_url = 3;
  string session_token = 4;
  string provider = 5;
  KYCVerificationStatus status = 6;
  string error_message = 7;
}

message ConfirmVerificationRequest {
  string verification_id = 1;
  string provider = 2;
  string provider_auth_code = 3;
  map<string, string> metadata = 4;
}

message ConfirmVerificationResponse {
  bool success = 1;
  KYCVerificationStatus status = 2;
  KYCTier current_tier = 3;
  string message = 4;
}

message GetDocumentUploadURLRequest {
  string document_type = 1;
  string content_type = 2;
}

message GetDocumentUploadURLResponse {
  bool success = 1;
  string upload_url = 2;
  string storage_key = 3;
  int64 expires_at = 4;
}

message DocumentSubmissionItem {
  string storage_key = 1;
  string document_type = 2;
  string content_type = 3;
}

message SubmitDocumentsForReviewRequest {
  repeated DocumentSubmissionItem documents = 1;
}

message SubmitDocumentsForReviewResponse {
  bool success = 1;
  string message = 2;
  KYCVerificationStatus status = 3;
}

message DataReconciliation {
  string name_action = 1;
  double name_match_score = 2;
  string verified_name = 3;
  string profile_name = 4;
  bool dob_mismatch = 5;
  string verified_dob = 6;
  string profile_dob = 7;
  bool phone_mismatch = 8;
}

message ConfirmBVNNameRequest {
  string action = 1;
  string verification_id = 2;
}

message ConfirmBVNNameResponse {
  bool success = 1;
  string message = 2;
  KYCVerificationStatus status = 3;
  KYCTier current_tier = 4;
}